### ekf config file ###
ekf_filter_node:
    ros__parameters:
        frequency: 30.0
        two_d_mode: false
        publish_acceleration: true

        publish_tf: true

        map_frame: map
        odom_frame: odom
        base_link_frame: base_footprint
        world_frame: odom

        odom0: /odom
        odom0_config: [false, false, false, # pozicija
                       false, false, false, # orijentacija
                       true,  true,  true,  # linearna brzina (vx, vy, vz)
                       false, false, true,  # kutna brzina
                       false, false, false] # akceleracija

        imu0: /imu/data_raw
        imu0_config: [false, false, false, # x, y, z
                      true,  true,  false, # roll, pitch, yaw
                      false, false, false, # vx, vy, vz
                      false, false, true,  # vroll, vpitch, vyaw 
                      false, false, false] # ax, ay, az
